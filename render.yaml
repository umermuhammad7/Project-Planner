services:
  - type: web
    name: homethread-backend
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install
    preDeployCommand: npm --workspace apps/backend run db:migrate
    startCommand: npx tsx apps/backend/src/server.ts
    healthCheckPath: /api/v1/health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/backend/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_CALENDAR_SCOPES
        value: https://www.googleapis.com/auth/calendar.readonly
      - key: CALENDAR_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JOBS_ENABLED
        value: "false"
      - key: EXPO_PUSH_ACCESS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TRAVEL_HOME_LATITUDE
        sync: false
      - key: TRAVEL_HOME_LONGITUDE
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: REVENUECAT_ENTITLEMENT_ID
        value: family_plus
